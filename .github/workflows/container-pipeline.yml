name: Container Image Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: demo-app

jobs:
  build:
    name: Build and Push to Staging
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure CLI
        run: |
          az login --service-principal \
            --username ${{ secrets.STAGING_CLIENT_ID }} \
            --password ${{ secrets.STAGING_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to Staging ACR
        run: az acr login --name ${{ secrets.STAGING_ACR_NAME }}

      - name: Generate image metadata
        id: meta
        run: |
          echo "tags=${{ secrets.STAGING_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push to staging
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.STAGING_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.STAGING_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:staging-latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure CLI
        run: |
          az login --service-principal \
            --username ${{ secrets.STAGING_CLIENT_ID }} \
            --password ${{ secrets.STAGING_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to Staging ACR
        run: az acr login --name ${{ secrets.STAGING_ACR_NAME }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.STAGING_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Run Trivy scan JSON output for artifact
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.STAGING_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: json
          output: trivy-results.json
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.json
          retention-days: 90

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure CLI
        run: |
          az login --service-principal \
            --username ${{ secrets.STAGING_CLIENT_ID }} \
            --password ${{ secrets.STAGING_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to Staging ACR
        run: az acr login --name ${{ secrets.STAGING_ACR_NAME }}

      - name: Install Trivy
        run: |
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Generate SBOM CycloneDX format
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom-cyclonedx.json \
            ${{ secrets.STAGING_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Generate SBOM SPDX format
        run: |
          trivy image \
            --format spdx-json \
            --output sbom-spdx.json \
            ${{ secrets.STAGING_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json
          retention-days: 365

  promote:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: [scan, sbom]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Login to Azure CLI
        run: |
          az login --service-principal \
            --username ${{ secrets.PROD_CLIENT_ID }} \
            --password ${{ secrets.PROD_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Promote image to production ACR
        run: |
          az acr import \
            --name acrprodjaneburo \
            --source acrstagingjaneburo.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            --force

      - name: Confirm production image
        run: |
          echo "Image promoted to production:"
          az acr repository show-tags \
            --name acrprodjaneburo \
            --repository ${{ env.IMAGE_NAME }} \
            --output table
            --output table
